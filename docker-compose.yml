services:
  form-bomber:
    build: .
    image: form-bomber:latest
    container_name: form-bomber
    restart: unless-stopped
    # больше /dev/shm — Chromium реже роняет рендерер (Target crashed)
    shm_size: "2gb"
    # правильная жатва зомби-процессов Chromium
    init: true
    ports:
      # хост:контейнер — наружу отдаём тот же 8002
      - "8002:8002"
    env_file:
      - .env
    volumes:
      # база и профили форм переживают пересоздание контейнера
      - ./data:/app/data
